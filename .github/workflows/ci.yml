name: Backtest CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate isolated EC2 exporter
        run: |
          python3 -m unittest discover -s scripts -p 'test_ec2_*.py' -v
          bash -n scripts/pull-history-from-ec2.sh
      - name: Run tests and build
        run: ./gradlew clean test build --no-daemon
