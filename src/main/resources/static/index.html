<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant Engine · Market workspace</title><link rel="stylesheet" href="/workspace.css"><script src="/workspace.js" defer></script></head>
<body><header><div class="bar"><strong class="brand"><span aria-hidden="true">∿</span> Quant Engine</strong><a href="/etf.html">ETF backtester ↗</a></div></header>
<nav aria-label="Market workspace"><div class="bar" id="navigation"><a href="#nifty">NIFTY</a><a href="#sensex">SENSEX</a><a href="#trading">Trading</a><a href="#equity">Equity</a></div></nav>
<main><section id="nifty"></section><section id="sensex" hidden></section>
<section id="trading" hidden><div class="heading"><div><small>OPERATIONS</small><h1>Trading monitor</h1></div><button id="refresh">Refresh status</button></div><p>Positions, budget and recent activity from the configured trading runtime.</p><div id="runtime" aria-live="polite"></div></section>
<section id="equity" hidden><small>DELIVERY RESEARCH</small><h1>Equity screener</h1><p>Find Indian small caps using AMFI classification and NSE/BSE closing data.</p>
<form id="screen"><div class="panel fields"><label>Minimum price (₹)<input name="minPrice" type="number" min=".01" step=".01" value="10" required></label><label>Maximum price, exclusive (₹)<input name="maxPrice" type="number" min=".02" step=".01" value="100" required></label><label>Minimum sessions<input name="minSessions" type="number" min="1" value="20" required></label><label>Maximum sessions<input name="maxSessions" type="number" min="1" value="45" required></label><label>Portfolio capital for sizing (optional, ₹)<input name="capital" type="number" min=".01" step=".01" placeholder="Optional"></label></div>
<div class="upload"><label>Import research evidence (optional)<input name="file" type="file" accept=".json,application/json"></label><button>Scan equities</button></div></form><div id="screenResult" aria-live="polite"></div></section></main></body></html>
