server:
  port: ${PORT:8081}
  address: ${HOST:127.0.0.1}
spring:
  application:
    name: quant-engine-test
management:
  endpoints:
    web:
      exposure:
        include: health,info
trading:
  mode: PAPER  # PAPER by default: simulated orders only. LIVE requires explicit YAML change and preflight.
  runtime:
    state-directory: ${TRADING_STATE_DIRECTORY:./data/runtime}
    poll-ms: 5000
    max-quote-age-seconds: 20
    entry-window-seconds: 45
    order-timeout-seconds: 20
    stop-limit-buffer-percent: 1.0
    client-code: ${ANGEL_ONE_CLIENT_CODE:}
  equity:
    # NSE website automated access is OFF unless your organization has express authorization.
    nse-website-access-authorized: ${TRADING_EQUITY_NSE_WEBSITE_ACCESS_AUTHORIZED:false}
    snapshot-path: ${TRADING_EQUITY_SNAPSHOT_PATH:data/equity/snapshot.json}
  history:
    options-replay-path: ${TRADING_HISTORY_OPTIONS_REPLAY_PATH:data/options/request.json}
    csv-path: ${HISTORY_CSV_PATH:data/history.csv}
    symbol: ${HISTORY_SYMBOL:NIFTYBEES}
    cache-dir: ${HISTORY_CACHE_DIR:data/cache}
    cache-max-age-hours: ${HISTORY_CACHE_MAX_AGE_HOURS:24}
    batch-days: ${HISTORY_BATCH_DAYS:14}
    access-key: ${BACKTEST_ACCESS_KEY:}
  strategy:
    v2-config-path: ${V2_STRATEGY_CONFIG_PATH:classpath:/strategy-vwap-ema.example.yml}
    options-config-path: ${OPTIONS_CONFIG_PATH:classpath:/index-options.yml}
  angel-one:
    api-key: ${ANGEL_ONE_API_KEY:}
    jwt: ${ANGEL_ONE_JWT_TOKEN:}
    jwt-file: ${ANGEL_ONE_JWT_FILE:}
    local-ip: ${ANGEL_ONE_CLIENT_LOCAL_IP:}
    public-ip: ${ANGEL_ONE_CLIENT_PUBLIC_IP:}
    mac-address: ${ANGEL_ONE_MAC_ADDRESS:}
    exchange: ${ANGEL_ONE_EXCHANGE:NSE}
    symbol-token: ${ANGEL_ONE_SYMBOL_TOKEN:}

logging:
  level:
    root: INFO                     # never log credentials/tokens/private client info
